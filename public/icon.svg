<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" stroke="#3b82f6" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
  <rect width="512" height="512" fill="#0f172a" stroke="none" />
  <g transform="translate(128, 128) scale(0.5)">
    <!-- A stylized airplane icon with some "neon" glow effects -->
    <path d="M480 32C480 32 400 32 304 96L96 64L32 128L176 224L80 320L16 288L0 320L64 384L128 448L160 432L128 368L224 272L320 416L384 352L352 144C416 48 480 32 480 32Z" fill="url(#grad)" stroke="#3b82f6" stroke-width="16" filter="url(#glow)"/>
  </g>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
